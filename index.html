<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dashboard dan Landing Page Resmi Nazama Bot" />
  <title>Nazama Bot - Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --success: #22c55e;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justifyContent: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }

    .badge .dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      border: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0f172a;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    footer {
      margin-top: 2rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="badge">
      <span class="dot"></span>
      <span id="bot-status">Sistem Berjalan Normal</span>
    </div>

    <h1>Nazama Bot</h1>
    <p class="subtitle">
      Bot multifungsi dengan performa tinggi untuk mengelola komunitas, otomatisasi tugas, dan interaksi interaktif.
    </p>

    <section class="stats-grid" aria-label="Statistik Bot">
      <div class="stat-card">
        <div class="stat-value" id="stat-ping">24 ms</div>
        <div class="stat-label">Latensi</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-uptime">99.9%</div>
        <div class="stat-label">Uptime</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-commands">50+</div>
        <div class="stat-label">Perintah Tersedia</div>
      </div>
    </section>

    <div class="actions">
      <a href="https://github.com/bacotbanget1/nazama-bot" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
        Kunjungi Repositori
      </a>
      <button type="button" class="btn btn-secondary" id="refresh-btn">
        Cek Status Ulang
      </button>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> Nazama Bot. All rights reserved.
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Set tahun copyright secara otomatis
      const yearEl = document.getElementById('year');
      if (yearEl) {
        yearEl.textContent = new Date().getFullYear();
      }

      // Tombol simulasi refresh status
      const refreshBtn = document.getElementById('refresh-btn');
      const pingEl = document.getElementById('stat-ping');
      const statusEl = document.getElementById('bot-status');

      if (refreshBtn && pingEl && statusEl) {
        refreshBtn.addEventListener('click', () => {
          refreshBtn.disabled = true;
          refreshBtn.textContent = 'Memeriksa...';
          
          setTimeout(() => {
            const randomPing = Math.floor(Math.random() * 30) + 15;
            pingEl.textContent = `${randomPing} ms`;
            statusEl.textContent = 'Sistem Terhubung';
            refreshBtn.disabled = false;
            refreshBtn.textContent = 'Cek Status Ulang';
          }, 600);
        });
      }
    });
  </script>
</body>
</html>
